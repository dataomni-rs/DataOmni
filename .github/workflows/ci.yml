name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
      site_changed: ${{ steps.filter.outputs.site_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 仅改官网、文档或发布清单的 PR 不空跑重型 Tauri 编译、真库容器与 Windows Runner；
      # main 分支 push 始终全量运行，README.md 因被 databaseSupport.test.ts 校验仍走 app_changed
      - name: Detect changed scopes
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          app_changed=false
          site_changed=false

          for file in "${files[@]}"; do
            case "$file" in
              site/*|images/*|docs/*|rfcs/*|packaging/*|scripts/winget-manifest.sh|scripts/homebrew-cask.sh|TODOs.md|AGENTS.md|README.en.md|LICENSE|.github/workflows/site.yml|.github/workflows/nightly-databases.yml|.github/workflows/windows-install.yml|.github/workflows/homebrew-tap.yml|.github/ISSUE_TEMPLATE/*)
                ;;
              *)
                app_changed=true
                ;;
            esac

            case "$file" in
              site/*|images/*|src-tauri/icons/*|package.json|bun.lock|eslint.config.js|rust-toolchain.toml|.github/workflows/ci.yml|.github/workflows/site.yml)
                site_changed=true
                ;;
            esac
          done

          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"
          echo "site_changed=${site_changed}" >> "$GITHUB_OUTPUT"

  site:
    needs: changes
    if: needs.changes.outputs.site_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint website scripts
        run: bunx eslint site/assets

      - name: Check website crate
        run: bun run site:check

  quality:
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Swatinem/rust-cache 清理 target 时会剥掉 libduckdb-sys 解压目录里的 .complete 标记，
      # 下次重跑 build.rs 时 rename 到非空目录会报 DirectoryNotEmpty；清掉让它按需从本地 tar.gz 重解
      - name: Clean cached DuckDB unpacked sources
        run: rm -rf src-tauri/target/duckdb-sources

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Type-check frontend
        run: bun run typecheck

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: bun run rust:fmt

      - name: Run Rust Clippy
        run: bun run rust:clippy

      # 不带默认可选特性（AI 与内置 Oracle 动态库驱动）的构建要一直编得过且过单测。见 rfcs/editions-and-branching.md §5
      - name: Rust clippy and unit tests (no default features)
        run: |
          bun run rust:clippy:no-ai
          cargo test --manifest-path src-tauri/Cargo.toml --lib --no-default-features

      - name: Test Rust
        run: bun run rust:test

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit frontend dependencies
        run: bun run audit:frontend

      - name: Audit Rust dependencies
        run: bun run rust:audit

  database-smoke:
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # 与 runner 自带的 pg_dump（16）同一个大版本：pg_dump 对更新的服务端直接拒绝，
        # 而 runner 上没配 PostgreSQL 的 apt 源，装不上新的客户端
        image: postgres:16
        env:
          POSTGRES_DB: dataomni_test
          POSTGRES_PASSWORD: dataomni
          POSTGRES_USER: dataomni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataomni -d dataomni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dataomni_test
          MYSQL_PASSWORD: dataomni
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: dataomni
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATAOMNI_REQUIRE_NETWORK_DATABASE_TESTS: "1"
      DATAOMNI_POSTGRES_TEST_URL: postgres://dataomni:dataomni@localhost:5432/dataomni_test
      # root：用例要建函数、触发器（开着 binlog 时普通用户要 SUPER）和恢复备份用的新库
      DATAOMNI_MYSQL_TEST_URL: mysql://root:root@localhost:3306/dataomni_test?ssl-mode=DISABLED

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clean cached DuckDB unpacked sources
        run: rm -rf src-tauri/target/duckdb-sources

      - name: Run database smoke tests
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test database_smoke -- --nocapture 2>&1 | tee smoke.log
          test "${PIPESTATUS[0]}" -eq 0
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            bash scripts/summarize-smoke-log.sh --header >> "$GITHUB_STEP_SUMMARY"
            bash scripts/summarize-smoke-log.sh "database_smoke (SQLite + PG 16 + MySQL 8.4)" smoke.log >> "$GITHUB_STEP_SUMMARY"
          fi

  # 只在 Windows 上成立的路径用例（`#[cfg(windows)]`）：超过 260 字符的 SQLite / DuckDB 库文件能打开、能备份。
  # 测试二进制没有 longPathAware 清单，所以 runner 上开没开 LongPathsEnabled 都一样要靠 `\\?\`。
  # 只跑这几条：整套用例在 Windows 上没人维护过，全跑会把别的平台差异混进来（TODOs G13）
  windows-paths:
    needs: changes
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 过滤名写错时 cargo 跑 0 条也算过：数一下真跑了的条数（SQLite 两条改写、SQLite 打开与备份、DuckDB 打开）
      - name: Run Windows path tests
        shell: bash
        run: |
          rm -rf src-tauri/target/duckdb-sources
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- max_path long_windows --nocapture 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "test result: ok. 4 passed" test.log
